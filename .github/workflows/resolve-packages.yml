name: Resolve packages

on:
  workflow_dispatch:

jobs:
  resolve:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Resolve
        run: |
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Adiuvaret.xcodeproj -scheme Adiuvaret
          cp Adiuvaret.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved ci_scripts/Package.resolved
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ci_scripts/Package.resolved
          git commit -m "Pin package versions for Xcode Cloud" || echo "no change"
          git push
