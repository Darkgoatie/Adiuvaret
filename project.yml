name: Adiuvaret
options:
  bundleIdPrefix: com.halit
  deploymentTarget:
    iOS: "26.0"
packages:
  AdiuvaretPackages:
    path: Packages
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Adiuvaret:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AdiuvaretPackages
        product: AdiuvaretCore
      - package: AdiuvaretPackages
        product: PolicyEngine
      - package: AdiuvaretPackages
        product: DesignSystem
      - package: AdiuvaretPackages
        product: Persistence
      - package: AdiuvaretPackages
        product: ToolKit
      - package: AdiuvaretPackages
        product: Diagnostics
      - package: AdiuvaretPackages
        product: ModelLibrary
      - package: AdiuvaretPackages
        product: MemoryKit
      - package: AdiuvaretPackages
        product: BriefingKit
      - package: AdiuvaretPackages
        product: SkillKit
      - package: AdiuvaretPackages
        product: Evals
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXVLM
      - package: MLXLM
        product: MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - target: AdiuvaretWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halit.adiuvaret
        DEVELOPMENT_TEAM: P6LL282795
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Adiuvaret.entitlements
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Adiuvaret
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Adiuvaret reads your calendar to answer questions about your day.
        INFOPLIST_KEY_NSContactsUsageDescription: Adiuvaret looks up a person in your contacts when you ask.
        INFOPLIST_KEY_NSCameraUsageDescription: Adiuvaret uses the camera when you take a photo to attach to a message.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Adiuvaret reads the photos you choose to attach to a message.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Adiuvaret creates reminders when you ask and approve.
        TARGETED_DEVICE_FAMILY: "1"
  AdiuvaretWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Adiuvaret
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halit.adiuvaret.widgets
        DEVELOPMENT_TEAM: P6LL282795
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Adiuvaret shows your next event on the Home and Lock Screen.
