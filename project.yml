name: Adiuvaret
options:
  bundleIdPrefix: com.halit
  deploymentTarget:
    iOS: "26.0"
packages:
  AdiuvaretPackages:
    path: Packages
targets:
  Adiuvaret:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AdiuvaretPackages
        product: AdiuvaretCore
      - package: AdiuvaretPackages
        product: PolicyEngine
      - package: AdiuvaretPackages
        product: DesignSystem
      - package: AdiuvaretPackages
        product: Persistence
      - package: AdiuvaretPackages
        product: ToolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halit.adiuvaret
        DEVELOPMENT_TEAM: P6LL282795
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Adiuvaret
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Adiuvaret reads your calendar to answer questions about your day.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Adiuvaret creates reminders when you ask and approve.
        TARGETED_DEVICE_FAMILY: "1"
